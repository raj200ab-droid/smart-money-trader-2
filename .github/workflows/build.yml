name: Build APK

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true

      - name: Stamp and mirror tests
        run: |
          python3 tool/mirror/test_stamps.py
          python3 tool/mirror/test_mirror.py
          python3 tool/mirror/test_universe.py

      - name: Create Android Project
        run: |
          cp lib/main.dart /tmp/my_main.dart
          cp pubspec.yaml /tmp/my_pubspec.yaml
          flutter create . --org com.smartmoney --project-name smart_money_trader --platforms android
          cp /tmp/my_main.dart lib/main.dart
          cp /tmp/my_pubspec.yaml pubspec.yaml
          echo "=== Files Restored ==="
          wc -l lib/main.dart

      - name: Enable network permission for release builds
        run: python3 tool/patch_manifest.py

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK has INTERNET permission
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          echo "using $AAPT"
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk \
            | tee /tmp/permissions.txt
          grep -q "android.permission.INTERNET" /tmp/permissions.txt \
            || { echo "::error::release APK has no INTERNET permission"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-money-trader-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
